<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario - Mosco Events</title>
<link href="style.css" rel="stylesheet">
<style>
.calendar-container{max-width:1200px;margin:120px auto 40px;padding:20px}
.calendar-header{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:20px}
.calendar-header button{padding:10px 15px;cursor:pointer}
#monthYear{font-size:2rem;font-weight:bold}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day-name,.day{border:1px solid rgba(255,255,255,.15);padding:10px;min-height:100px}
.day-name{text-align:center;font-weight:bold}
.day.event{border:2px solid #8d9a55}
.event-item{margin-top:5px;padding:4px;font-size:.8rem;background:rgba(141,154,85,.25);border-radius:4px}
.google-calendar{margin-top:30px;text-align:center}
iframe{width:100%;height:700px;border:none}
</style>
</head>
<body>
<div class="calendar-container">
<div class="calendar-header">
<button onclick="changeMonth(-1)">◀</button>
<h1 id="monthYear"></h1>
<button onclick="changeMonth(1)">▶</button>
</div>

<div class="calendar" id="calendar"></div>

<div class="google-calendar">
<h2>Google Calendar (opcional)</h2>
<p>Sustituye TU_ID_DE_CALENDARIO por el ID de tu Google Calendar para gestionar eventos sin tocar el HTML.</p>
<iframe src="https://calendar.google.com/calendar/embed?src=TU_ID_DE_CALENDARIO"></iframe>
</div>
</div>

<script>
const events = {
  "2026-08-09": ["🔥 Operación Verano"],
  "2026-09-20": ["🔫 Próxima partida"]
};

let currentDate = new Date();

function renderCalendar(){
  const calendar = document.getElementById("calendar");
  const monthYear = document.getElementById("monthYear");
  calendar.innerHTML = "";

  const month = currentDate.getMonth();
  const year = currentDate.getFullYear();

  monthYear.textContent = new Date(year, month).toLocaleDateString("es-ES",{month:"long",year:"numeric"});

  ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(d=>{
    const el=document.createElement("div");
    el.className="day-name";
    el.textContent=d;
    calendar.appendChild(el);
  });

  let firstDay = new Date(year,month,1).getDay();
  firstDay = firstDay === 0 ? 6 : firstDay - 1;

  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    calendar.appendChild(document.createElement("div"));
  }

  for(let day=1; day<=daysInMonth; day++){
    const dateKey=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const cell=document.createElement("div");
    cell.className="day";

    if(events[dateKey]){
      cell.classList.add("event");
      events[dateKey].forEach(ev=>{
        const e=document.createElement("div");
        e.className="event-item";
        e.textContent=ev;
        cell.appendChild(e);
      });
    }

    cell.prepend(document.createTextNode(day));
    calendar.appendChild(cell);
  }
}

function changeMonth(step){
  currentDate.setMonth(currentDate.getMonth()+step);
  renderCalendar();
}

renderCalendar();
</script>
</body>
</html>
