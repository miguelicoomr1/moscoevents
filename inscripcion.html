<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscripción - Operación Verano</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    background:#111;
    color:white;
    font-family:'Rajdhani',sans-serif;
    margin:0;
    padding:40px 20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#1a1a1a;
    padding:30px;
    border-radius:10px;
}

h1{
    text-align:center;
    color:#8d9a55;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input, select, textarea{
    padding:12px;
    border:none;
    border-radius:6px;
    background:#222;
    color:white;
}

button{
    padding:15px;
    border:none;
    background:#8d9a55;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#mensaje{
    text-align:center;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">

<h1>🔥 Operación Verano</h1>

<form id="formInscripcion">

<input type="text" id="nombre" placeholder="Nombre" required>

<input type="text" id="apellidos" placeholder="Apellidos" required>

<input type="text" id="nick" placeholder="Nick Airsoft">

<input type="email" id="email" placeholder="Correo electrónico" required>

<input type="tel" id="telefono" placeholder="Teléfono" required>

<input type="text" id="equipo" placeholder="Equipo">

<textarea id="observaciones" rows="4"
placeholder="Observaciones"></textarea>

<button type="submit">
    INSCRIBIRME
</button>

</form>

<div id="mensaje"></div>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://zdrdtaeegoucfnbugzmt.supabase.co/rest/v1/'
const supabaseKey = 'sb_publishable_HrUKpmzXYux1BZZpRedABA_1JWdOOhk'

const supabase = createClient(
    supabaseUrl,
    supabaseKey
)

document
.getElementById('formInscripcion')
.addEventListener('submit', async (e)=>{

    e.preventDefault()

    const { error } = await supabase
    .from('inscripciones')
    .insert([{
        evento:'Operación Verano',
        nombre: nombre.value,
        apellidos: apellidos.value,
        nick: nick.value,
        email: email.value,
        telefono: telefono.value,
        equipo: equipo.value,
        faccion: faccion.value,
        observaciones: observaciones.value
    }])

    const mensaje =
        document.getElementById('mensaje')

    if(error){
        mensaje.innerHTML =
        '❌ Error al realizar la inscripción'
        console.error(error)
        return
    }

    mensaje.innerHTML =
    '✅ Inscripción realizada correctamente'

    e.target.reset()
})

</script>

</body>
</html>
