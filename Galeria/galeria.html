<script src="/header.js?v=7"></script>
<script src="/i18n-lang.js?v=2"></script>
<script src="/i18n.js?v=2"></script>

<section class="hero" aria-label="Galería Mosco Events">

    <div class="overlay"></div>

    <div class="hero-content">

        <h1 data-i18n="common.gallery_heading">GALERÍA</h1>

        <p data-i18n="galeria_page.hero_subtitle">
            Fotografías de Mosco Events
        </p>

    </div>

</section>

<main>

    <section class="galeria">

        <h2 data-i18n="eventos.gallery.detail_title">GALERÍA DE IMÁGENES</h2>

        <div class="gallery-grid" data-random-gallery="20">



</div>

        <!-- Modal galería -->
        <div id="modal" class="modal">

            <button class="close" type="button" aria-label="Cerrar imagen" data-i18n-attr-aria-label="common.modal_close_aria">&times;</button>

            <button class="prev" type="button" aria-label="Imagen anterior" data-i18n-attr-aria-label="common.modal_prev_aria">&#10094;</button>

            <img
                id="modal-img"
                alt="Imagen ampliada" data-i18n-attr-alt="common.modal_image_alt">

            <button class="next" type="button" aria-label="Imagen siguiente" data-i18n-attr-aria-label="common.modal_next_aria">&#10095;</button>

        </div>
 <div class="gallery-next" data-gallery-list></div>

    </section>

    <section id="contacto" class="contacto">

        <h2 data-i18n="common.contacto_titulo">CONTACTO</h2>

        <p data-i18n="common.contacto_pregunta">
            ¿Preparado para la siguiente partida?
        </p>

        <a
            class="whatsapp" data-i18n="common.whatsapp"
             href="https://wa.me/34698125932?text=Hola,%20me%20interesa%20Mosco%20Events.%20%C2%BFC%C3%B3mo%20puedo%20participar%20en%20los%20pr%C3%B3ximos%20eventos%3F"
            target="_blank"
            rel="noopener noreferrer">

            CONTACTAR POR WHATSAPP

        </a>

        <a
            class="instagram" data-i18n="common.instagram"
            href="https://www.instagram.com/mosco.events/"
            target="_blank"
            rel="noopener noreferrer">

            CONTACTAR POR INSTAGRAM

        </a>

    </section>

</main>
